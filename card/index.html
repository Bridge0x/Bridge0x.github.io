:root{--bg:#0e0f13;--fg:#ecebf0;--muted:#9a9ba5;--line:#24262e;--card:#16181e;--accent:#a993ff;--accent2:#4fd1c5;--glow:rgba(169,147,255,.16);color-scheme:dark}
:root[data-theme="light"]{--bg:#f7f6f2;--fg:#15161a;--muted:#64656c;--line:#e0ddd4;--card:#fff;--accent:#5b45e0;--accent2:#0fa3a3;--glow:rgba(91,69,224,.14);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -40px var(--accent)}
.top{height:96px;background:linear-gradient(110deg,var(--accent),var(--accent2))}
.body{padding:0 24px 24px;text-align:center}
.pic{width:112px;height:112px;margin:-56px auto 0;border-radius:50%;overflow:hidden;border:4px solid var(--card);background:var(--card)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.75rem;letter-spacing:-.02em;margin-top:12px}
.loc{font-size:.85rem;color:var(--muted)}
.roles{list-style:none;margin:16px 0 0;border:1px solid var(--line);border-radius:14px;text-align:left}
.roles li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:.92rem}
.roles li:first-child{border-top:0}
.roles span{color:var(--muted)}
.roles b{font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:500;font-size:.95rem;color:var(--fg);cursor:pointer;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{margin-top:20px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
.socials{display:flex;justify-content:center;gap:8px;margin-top:20px}
.s{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--glow);transition:background .15s,color .15s}
.s:hover{background:var(--accent);color:var(--bg)}
.s svg{width:19px;height:19px;fill:currentColor}
.qr{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.qr summary{cursor:pointer;font-size:.88rem;color:var(--muted);list-style:none}
.qr summary::-webkit-details-marker{display:none}
.qr summary:hover{color:var(--fg)}
.qr svg{width:180px;height:180px;margin:14px auto 0;display:block;border-radius:10px}
.qr p{font-size:.8rem;color:var(--muted);margin-top:8px}
.foot{margin-top:16px;font-size:.8rem;color:var(--muted)}
.btn.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.lead{text-align:left;margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px}
.lead[hidden]{display:none}
.lead h2{font-size:1rem;font-weight:600}
.lead p.h{font-size:.85rem;color:var(--muted);margin-top:2px}
.lead label{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:12px}
.lead input,.lead textarea{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.lead input:focus,.lead textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.lead textarea{min-height:88px;resize:vertical}
.lead .btn{margin-top:14px}
.lead .msg{font-size:.88rem;margin-top:10px;text-align:center}
.lead .msg.err{color:#e5484d}
.lead .ok{text-align:center;padding:10px 0}
.lead .ok b{display:block;font-size:1.05rem}
.lead .ok span{font-size:.88rem;color:var(--muted)}
.hp{position:absolute;left:-9999px}
</style>
